<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Heng timer</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Heng">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
/* VOICE: rolig verktøy på veggen, store tall, ingenting som står stille
   IDEA: et hengebrett-treningskort – rader med økter, én stor klokke
   PICTURE: ringen er selve klokken; den roterer startpunkt og driver i posisjon
   COLOUR/TYPE: krittgrå/kull grunn, korall for heng, grønnblå for hvile; Barlow Condensed
   LAYOUT: liste av økter -> redigering -> fullskjerm kjøring */
:root{color-scheme:light dark;--bg:light-dark(#efece6,#0b0b0b);--card:light-dark(#fff,#171615);--ink:light-dark(#1d1b19,#e9e5de);--mut:light-dark(#77716a,#8a847c);--line:light-dark(#dcd7cf,#2a2826);--hang:#b0705c;--rest:#6f8f86;--prep:#a08a5e}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif;overflow-x:clip}
.band{padding:clamp(20px,4vw,48px) max(5vw,16px);max-width:760px;margin:auto}
h1{font:700 40px/1.05 'Barlow Condensed',sans-serif;margin:0 0 4px}
h2{font:700 24px/1.1 'Barlow Condensed',sans-serif;margin:0}
.sub{color:var(--mut);margin:0 0 20px}
button{font:600 16px Barlow,sans-serif;min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--hang);outline-offset:2px}
.go{background:var(--hang);border-color:var(--hang);color:#fff}
.list{display:grid;gap:10px}
.w{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 14px 14px 18px}
.w .t{flex:1}.w small{color:var(--mut);display:block}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.ed{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-top:12px}
label{font-size:14px;color:var(--mut);display:grid;gap:4px}
input{font:16px Barlow,sans-serif;min-height:44px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.full{grid-column:1/-1}
.note{font-size:14px;color:var(--mut);margin-top:24px}
/* kjøreskjerm */
#run{position:fixed;inset:0;background:#000;color:#8f8a83;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:9;user-select:none}
#run.on{display:flex}
#stage{display:flex;flex-direction:column;align-items:center;transition:transform 4s ease-in-out,filter .4s}
#stage{filter:brightness(.8) saturate(.8)}
#run.dim #stage{filter:brightness(.45) saturate(.7)}
.clock{position:relative;width:min(78vw,62vh,440px);aspect-ratio:1}
.clock svg{position:absolute;inset:0;width:100%;height:100%;transition:transform 1.2s ease,opacity .8s}
#run.bare .clock svg,#run.rest2 .clock svg{opacity:0}
#run.rest2 #stage{filter:brightness(.55)}
.clock .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
#num{color:#9a958e;font:700 clamp(72px,22vw,160px)/1 'Barlow Condensed',sans-serif;font-variant-numeric:tabular-nums}
#ph{font:600 22px 'Barlow Condensed',sans-serif;letter-spacing:.02em}
#info{margin-top:18px;font:500 20px 'Barlow Condensed',sans-serif;color:#5f5b56;text-align:center}
#grip{font:700 28px 'Barlow Condensed',sans-serif;color:#7d7871;min-height:34px}
.ctl{position:absolute;bottom:max(20px,env(safe-area-inset-bottom));display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.ctl{opacity:.5}.ctl button{background:#111;border-color:#1e1e1e;color:#888}
@media(prefers-reduced-motion:reduce){#stage,.clock svg{transition:none}}
.blk{border-top:1px solid var(--line);margin-top:18px;padding-top:14px}
.bh{display:flex;justify-content:space-between;align-items:center;gap:8px}.bh span{display:flex;gap:6px}
.chk{display:flex!important;align-items:center;gap:10px;color:var(--ink)!important;font-size:16px!important}.chk input{width:24px;min-height:24px}
</style>
</head>
<body>
<main class="band">
  <h1>Heng</h1>
  <p class="sub">Hengebrett-timer uten innbrenning: ringen flytter seg, roterer og kan dimmes.</p>
  <div class="list" id="list"></div>
  <div class="row"><button id="new">+ Ny økt</button><button id="imp">Importer</button><button id="exp">Kopier alle økter</button></div>
  <form class="ed" id="impf" hidden><h2>Importer økter</h2><p class="sub" style="margin:6px 0 10px">Lim inn teksten du har fått fra Claude, eller en tidligere kopi.</p><textarea id="impt" rows="6" style="width:100%;font:14px ui-monospace,monospace;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)"></textarea><div class="row"><button class="go" type="submit">Legg til</button><button type="button" id="impc">Avbryt</button></div><p id="impm" class="sub" style="margin:8px 0 0"></p></form>
  <div id="edit"></div>
  <p class="note">Øktene lagres i denne nettleseren. Skjermen holdes våken under økta der nettleseren tillater det. Trykk på klokka for pause.</p>
</main>

<section id="run" aria-live="polite">
  <div id="stage">
    <div id="grip"></div>
    <div class="clock">
      <svg viewBox="0 0 200 200" id="ringsvg">
                <circle id="ring" cx="100" cy="100" r="90" fill="none" stroke-width="8" stroke-linecap="round" transform="rotate(-90 100 100)" pathLength="1000" stroke-dasharray="1000" stroke-dashoffset="0"/>
      </svg>
      <div class="mid"><div id="num">0</div><div id="ph"></div></div>
    </div>
    <div id="info"></div>
  </div>
  <div class="ctl">
    <button id="bPrev">⟲ Forrige</button>
    <button id="bPause">Pause</button>
    <button id="bSkip">Hopp over ⟶</button>
    <button id="bDim">Dim</button>
    <button id="bBare">Skjul ring</button>
    <button id="bStop">Avslutt</button>
  </div>
</section>

<script>
{
const KEY='heng-okter-v1';
const B=(name,sets,reps,hang,rest,setRest,after,sides)=>({name,sets,reps,hang,rest,setRest,after,sides});
const DEF=[
 {id:'a',name:'Repeaters 7/3',prep:10,blocks:[B('Half crimp',4,6,7,3,180,180,false)]},
 {id:'b',name:'Max hangs',prep:10,blocks:[B('Half crimp',5,1,10,0,180,180,false)]}
];
const num=(v,min=0)=>Math.max(min,parseInt(v)||0);
// gammelt format (én øvelse) -> nytt format med blocks
function norm(o,id){
  const w={id:id||o.id||Date.now().toString(36),name:String(o.name||'Importert økt').slice(0,80),prep:num(o.prep)};
  const bl=Array.isArray(o.blocks)?o.blocks:[{name:o.grips||o.name,sets:o.sets,reps:o.reps,hang:o.hang,rest:o.rest,setRest:o.setRest,after:o.setRest,sides:o.sides}];
  w.blocks=bl.map(b=>B(String(b.name||'Øvelse').slice(0,60),num(b.sets,1),num(b.reps,1),num(b.hang,1),num(b.rest),num(b.setRest),num(b.after),!!b.sides));
  return w;
}
let W;
try{W=(JSON.parse(localStorage.getItem(KEY))||DEF).map(o=>norm(o))}catch(e){W=DEF.map(o=>norm(o))}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(W))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
const fmt=s=>s>=60?Math.floor(s/60)+':'+String(s%60).padStart(2,'0'):String(s);

function plan(w){
  const P=[];if(w.prep)P.push({k:'prep',d:w.prep,b:w.blocks[0],set:1});
  w.blocks.forEach((b,bi)=>{
    const H=b.sides?['Høyre hånd','Venstre hånd']:[''];
    for(let s=1;s<=b.sets;s++){
      for(let r=1;r<=b.reps;r++)H.forEach((h,j)=>{P.push({k:'hang',d:b.hang,b,set:s,rep:r,hand:h});
        if((r<b.reps||j<H.length-1)&&b.rest)P.push({k:'rest',d:b.rest,b,set:s,rep:r,next:H[(j+1)%H.length]})});
      if(s<b.sets&&b.setRest)P.push({k:'setRest',d:b.setRest,b,set:s+1});
    }
    const nb=w.blocks[bi+1];if(nb&&b.after)P.push({k:'setRest',d:b.after,b:nb,set:1,nextBlock:true});
  });
  return P;
}
const total=w=>plan(w).reduce((a,p)=>a+p.d,0);
const desc=b=>`${b.sets} × ${b.reps}${b.sides?' (H+V)':''} · ${b.hang}s/${b.rest}s · ${fmt(b.setRest)} pause`;

function renderList(){
  $('list').innerHTML=W.map(w=>`<div class="w"><div class="t"><h2>${esc(w.name)}</h2><small>${w.blocks.map(b=>esc(b.name)).join(' → ')} · ca. ${Math.round(total(w)/60)} min</small></div><button data-e="${esc(w.id)}">Rediger</button><button class="go" data-s="${esc(w.id)}">Start</button></div>`).join('')||'<p class="sub">Ingen økter ennå.</p>';
}
const BF=[['name','Øvelse','text'],['sets','Sett'],['reps','Reps per sett'],['hang','Heng (s)'],['rest','Hvile mellom reps (s)'],['setRest','Pause mellom sett (s)'],['after','Pause før neste øvelse (s)']];
let E=null;
function edit(id){
  const src=W.find(x=>x.id===id);
  E=src?JSON.parse(JSON.stringify(src)):{id:Date.now().toString(36),name:'Ny økt',prep:5,blocks:[B('Øvelse 1',3,2,5,5,120,60,false)]};
  E.isNew=!src;drawEdit();
  $('ef').scrollIntoView({behavior:'smooth',block:'nearest'});
}
function readEdit(){
  E.name=$('f_name').value.trim()||'Økt';E.prep=num($('f_prep').value);
  E.blocks.forEach((b,i)=>{for(const [k,,t] of BF){const v=$(`b${i}_${k}`).value;b[k]=t?v.trim()||'Øvelse':num(v,['sets','reps','hang'].includes(k)?1:0)}b.sides=$(`b${i}_sides`).checked});
}
function drawEdit(){
  $('edit').innerHTML=`<form class="ed" id="ef"><h2>${E.isNew?'Ny':'Rediger'} økt</h2><div class="grid"><label class="full">Navn<input id="f_name" type="text" value="${esc(E.name)}"></label><label>Klargjøring (s)<input id="f_prep" type="number" min="0" inputmode="numeric" value="${E.prep}"></label></div>
  ${E.blocks.map((b,i)=>`<div class="blk"><div class="bh"><b>${i+1}. ${esc(b.name)}</b><span><button type="button" data-up="${i}" aria-label="Flytt opp">↑</button><button type="button" data-rm="${i}" aria-label="Fjern øvelse">Fjern</button></span></div><div class="grid">${BF.map(([k,l,t])=>`<label class="${t?'full':''}">${l}<input id="b${i}_${k}" ${t?'type="text"':'type="number" min="0" inputmode="numeric"'} value="${esc(b[k])}"></label>`).join('')}<label class="full chk"><input type="checkbox" id="b${i}_sides" ${b.sides?'checked':''}> Én hånd om gangen (høyre, så venstre)</label></div></div>`).join('')}
  <div class="row"><button type="button" id="addb">+ Legg til øvelse</button></div>
  <div class="row"><button class="go" type="submit">Lagre</button><button type="button" id="ecancel">Avbryt</button>${E.isNew?'':'<button type="button" id="edel">Slett økt</button>'}</div></form>`;
  $('ef').onsubmit=e=>{e.preventDefault();readEdit();const w=norm(E,E.id);const i=W.findIndex(x=>x.id===w.id);if(i<0)W.push(w);else W[i]=w;save();renderList();$('edit').innerHTML='';E=null};
  $('ef').onclick=e=>{const t=e.target.closest('button');if(!t)return;
    if(t.dataset.rm){readEdit();if(E.blocks.length>1){E.blocks.splice(+t.dataset.rm,1);drawEdit()}}
    if(t.dataset.up){readEdit();const i=+t.dataset.up;if(i>0){[E.blocks[i-1],E.blocks[i]]=[E.blocks[i],E.blocks[i-1]];drawEdit()}}};
  $('addb').onclick=()=>{readEdit();const l=E.blocks[E.blocks.length-1];E.blocks.push({...l,name:'Øvelse '+(E.blocks.length+1)});drawEdit()};
  $('ecancel').onclick=()=>{$('edit').innerHTML='';E=null};
  if($('edel'))$('edel').onclick=()=>{if($('edel').dataset.c){W=W.filter(x=>x.id!==E.id);save();renderList();$('edit').innerHTML='';E=null}else{$('edel').dataset.c=1;$('edel').textContent='Trykk igjen for å slette'}};
}
$('list').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.e)edit(b.dataset.e);if(b.dataset.s)start(W.find(x=>x.id===b.dataset.s))};
$('new').onclick=()=>edit(null);
$('imp').onclick=()=>{$('impf').hidden=false;$('impm').textContent='';$('impt').focus()};
$('impc').onclick=()=>$('impf').hidden=true;
$('impf').onsubmit=e=>{e.preventDefault();
  try{let a=JSON.parse($('impt').value);if(!Array.isArray(a))a=[a];a.forEach((o,n)=>W.push(norm(o,Date.now().toString(36)+n)));
    save();renderList();$('impt').value='';$('impm').textContent=`La til ${a.length} økt${a.length===1?'':'er'}.`;
  }catch(err){$('impm').textContent='Fant ikke gyldige økter i teksten. Sjekk at du limte inn alt.'}};
$('exp').onclick=async()=>{const t=JSON.stringify(W.map(({id,...r})=>r));try{await navigator.clipboard.writeText(t);$('exp').textContent='Kopiert ✓'}catch(e){$('impf').hidden=false;$('impt').value=t;$('impm').textContent='Kunne ikke kopiere automatisk – merk og kopier teksten over.'}setTimeout(()=>$('exp').textContent='Kopier alle økter',2000)};

// ---- lyd, vibrasjon, wake lock
let ac,lock;
const beep=(f,d)=>{try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(.25,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.start();o.stop(ac.currentTime+d)}catch(e){}};
const buzz=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
async function wake(on){try{if(on&&navigator.wakeLock)lock=await navigator.wakeLock.request('screen');else if(lock){await lock.release();lock=null}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S)wake(true)});

// ---- kjøring
let S=null,raf,drift;
const LBL={prep:'Gjør deg klar',hang:'HENG',rest:'Hvil',setRest:'Pause'};
const COL={prep:'var(--prep)',hang:'var(--hang)',rest:'var(--rest)',setRest:'var(--rest)'};
function start(w){
  beep(1,.01);S={w,P:plan(w),i:0,t0:performance.now(),pAt:0,last:-1,rot:0};
  $('run').classList.add('on');wake(true);enter();loop();
  const mv=()=>{const r=S&&S.P[S.i]&&S.P[S.i].k==='setRest'?60:24,x=(Math.random()*2-1)*r,y=(Math.random()*2-1)*r;$('stage').style.transform=`translate(${x}px,${y}px)`};drift=setInterval(mv,6000);
}
function enter(){
  const p=S.P[S.i];S.t0=performance.now();S.last=-1;S.rot=(S.rot+37)%360;
  $('ringsvg').style.transform=`rotate(${S.rot}deg) scale(${(.8+Math.random()*.2).toFixed(3)})`;$('ring').setAttribute('stroke-width',String(5+Math.round(Math.random()*4)));$('run').classList.toggle('rest2',p.k==='setRest');
  $('ring').style.stroke=COL[p.k];$('ph').style.color=COL[p.k];
  $('ph').textContent=p.hand?'HENG · '+p.hand.toUpperCase():p.k==='rest'&&p.next?'Hvil · neste: '+p.next.toLowerCase():p.nextBlock?'Neste: '+p.b.name:LBL[p.k];
  $('grip').textContent=p.b.name;
  $('info').textContent=`Sett ${p.set}/${p.b.sets}`+(p.k==='hang'&&p.b.reps>1?` · rep ${p.rep}/${p.b.reps}`:'');
  if(p.k==='hang'){beep(1046,.5);buzz(300)}else if(S.i>0){beep(392,.5);buzz([100,80,100])}
}
function loop(){
  raf=requestAnimationFrame(loop);if(!S||S.pAt)return;
  const p=S.P[S.i],el=(performance.now()-S.t0)/1000,left=p.d-el;
  if(left<=0){if(++S.i>=S.P.length)return finish();enter();return}
  const s=Math.ceil(left);
  if(s!==S.last){S.last=s;$('num').textContent=fmt(s);if(s<=3&&p.d>3)beep(784,.08)}
  $('ring').setAttribute('stroke-dashoffset',String(1000*(1-left/p.d)));
}
function finish(){beep(392,.5);setTimeout(()=>beep(1046,.25),600);setTimeout(()=>beep(1318,.45),850);buzz([200,100,200]);
  $('run').classList.remove('rest2');$('ph').textContent='Ferdig';$('num').textContent='✓';$('grip').textContent='';$('info').textContent=S.w.name;$('ring').setAttribute('stroke-dashoffset','1000');
  cancelAnimationFrame(raf);S.done=1;}
function stop(){cancelAnimationFrame(raf);clearInterval(drift);S=null;$('run').classList.remove('on','dim','rest2');wake(false)}
function pause(){if(!S||S.done)return;if(S.pAt){S.t0+=performance.now()-S.pAt;S.pAt=0;$('bPause').textContent='Pause'}else{S.pAt=performance.now();$('bPause').textContent='Fortsett';$('ph').textContent='Pause'}}
$('bPause').onclick=pause;$('run').querySelector('.clock').onclick=pause;
$('bSkip').onclick=()=>{if(!S||S.done)return;if(++S.i>=S.P.length)return finish();S.pAt=0;$('bPause').textContent='Pause';enter()};
$('bPrev').onclick=()=>{if(!S||S.done)return;S.i=Math.max(0,S.i-1);S.pAt=0;$('bPause').textContent='Pause';enter()};
$('bDim').onclick=()=>$('run').classList.toggle('dim');
$('bBare').onclick=()=>{const b=$('run').classList.toggle('bare');$('bBare').textContent=b?'Vis ring':'Skjul ring';try{localStorage.setItem('heng-bare',b?'1':'')}catch(e){}};
try{if(localStorage.getItem('heng-bare')){$('run').classList.add('bare');$('bBare').textContent='Vis ring'}}catch(e){}
$('bStop').onclick=stop;
document.addEventListener('keydown',e=>{if(!S)return;if(e.key===' '){e.preventDefault();pause()}if(e.key==='Escape')stop()});
renderList();
}
</script>
<script>if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))</script>
</body>
</html>
